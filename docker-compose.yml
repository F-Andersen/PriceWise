# PriceWise production stack: PostgreSQL + API + web (Caddy with HTTPS).
#   cp .env.production.example .env   # then fill in the values
#   docker compose up -d --build
# Only Caddy is published (80/443); the API and the database stay internal.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: price_monitoring
      POSTGRES_USER: pricewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricewise -d price_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://pricewise:${POSTGRES_PASSWORD}@db:5432/price_monitoring?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PRICE_SYNC_ENABLED: ${PRICE_SYNC_ENABLED:-true}
      PRICE_SYNC_TIME: ${PRICE_SYNC_TIME:-06:00}
      PRICE_HISTORY_DAYS: ${PRICE_HISTORY_DAYS:-730}
      # Scheduled collection times are in this time zone.
      TZ: ${TZ:-Europe/Kyiv}

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: /api
        EXPO_PUBLIC_DEMO_LOGIN: ${DEMO_LOGIN:-false}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
